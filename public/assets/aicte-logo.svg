<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="goldGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#F6E05E" />
      <stop offset="50%" stop-color="#D69E2E" />
      <stop offset="100%" stop-color="#975A16" />
    </radialGradient>
    <linearGradient id="saffron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#DD6B20" />
    </linearGradient>
  </defs>
  
  <!-- Outer Gear Ring with Cog Teeth -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  
  <!-- Cog teeth around perimeter -->
  <g stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round">
    <line x1="50" y1="3" x2="50" y2="9" />
    <line x1="50" y1="91" x2="50" y2="97" />
    <line x1="3" y1="50" x2="9" y2="50" />
    <line x1="91" y1="50" x2="97" y2="50" />
    <line x1="16.8" y1="16.8" x2="21" y2="21" />
    <line x1="79" y1="79" x2="83.2" y2="83.2" />
    <line x1="16.8" y1="83.2" x2="21" y2="79" />
    <line x1="79" y1="21" x2="83.2" y2="16.8" />
    <line x1="33" y1="5.5" x2="35" y2="11" />
    <line x1="67" y1="5.5" x2="65" y2="11" />
    <line x1="33" y1="94.5" x2="35" y2="89" />
    <line x1="67" y1="94.5" x2="65" y2="89" />
    <line x1="5.5" y1="33" x2="11" y2="35" />
    <line x1="5.5" y1="67" x2="11" y2="65" />
    <line x1="94.5" y1="33" x2="89" y2="35" />
    <line x1="94.5" y1="67" x2="89" y2="65" />
  </g>

  <!-- Inner circle background: Deep Forest Green -->
  <circle cx="50" cy="50" r="40" fill="#142B21" stroke="#C5A568" stroke-width="1.8" />

  <!-- Dotted circle guideline -->
  <circle cx="50" cy="50" r="33" fill="none" stroke="#C5A568" stroke-width="1" stroke-dasharray="2.5,2.5" opacity="0.6" />

  <!-- Sacred Lamp of Learning Base & Stand -->
  <!-- Stand -->
  <path d="M44 54 L56 54 L53 66 L47 66 Z" fill="url(#goldGrad)" />
  <ellipse cx="50" cy="54" rx="9" ry="2.5" fill="#C5A568" />
  <path d="M40 66 C40 64 60 64 60 66 L62 69 L38 69 Z" fill="url(#goldGrad)" />

  <!-- Sacred Lamp Flame (Light of Knowledge) -->
  <path d="M50 20 C54 28 60 34 57 43 C54 49 46 49 43 43 C40 34 46 28 50 20 Z" fill="url(#saffron)" />
  <path d="M50 26 C52 31 56 36 54 42 C53 45 47 45 46 42 C44 36 48 31 50 26 Z" fill="#FEFCBF" />

  <!-- Saffron & Gold Radiance Dots -->
  <circle cx="50" cy="16" r="1.5" fill="#FF9933" />
  <circle cx="43" cy="22" r="1.2" fill="#F6E05E" />
  <circle cx="57" cy="22" r="1.2" fill="#F6E05E" />

  <!-- AICTE Ribbon Banner -->
  <path d="M22 72 Q50 67 78 72 L75 80 Q50 75 25 80 Z" fill="#C5A568" stroke="#975A16" stroke-width="0.5" />
  <text x="50" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="6.5" font-weight="900" fill="#142B21" text-anchor="middle" letter-spacing="1.2">AICTE</text>

  <!-- Bottom National tricolor accents -->
  <rect x="42" y="83" width="5" height="1.5" fill="#FF9933" rx="0.5" />
  <rect x="47.5" y="83" width="5" height="1.5" fill="#FFFFFF" rx="0.5" />
  <rect x="53" y="83" width="5" height="1.5" fill="#138808" rx="0.5" />
</svg>

