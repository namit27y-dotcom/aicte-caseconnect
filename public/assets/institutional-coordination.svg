<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142B21" />
      <stop offset="50%" stop-color="#193B2A" />
      <stop offset="100%" stop-color="#0E2319" />
    </linearGradient>
    <radialGradient id="warmLight" cx="20%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#C5A568" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#C5A568" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#142B21" stop-opacity="0" />
    </radialGradient>
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#829B86" stroke-width="0.5" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Deep Forest Green Background -->
  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#warmLight)" />
  <rect width="1200" height="675" fill="url(#archGrid)" />

  <!-- Classical Indian Institutional Architectural Elements (Silhouettes) -->
  <g opacity="0.18" fill="#C5A568">
    <!-- Base podium -->
    <rect x="100" y="480" width="1000" height="30" rx="3" />
    <rect x="80" y="510" width="1040" height="40" rx="4" />
    <rect x="50" y="550" width="1100" height="70" rx="4" />

    <!-- Colonnade Pillars -->
    <rect x="150" y="240" width="34" height="240" rx="3" />
    <rect x="230" y="240" width="34" height="240" rx="3" />
    <rect x="310" y="240" width="34" height="240" rx="3" />
    <rect x="390" y="240" width="34" height="240" rx="3" />
    <rect x="470" y="240" width="34" height="240" rx="3" />
    <rect x="690" y="240" width="34" height="240" rx="3" />
    <rect x="770" y="240" width="34" height="240" rx="3" />
    <rect x="850" y="240" width="34" height="240" rx="3" />
    <rect x="930" y="240" width="34" height="240" rx="3" />
    <rect x="1010" y="240" width="34" height="240" rx="3" />

    <!-- Central Grand Entrance Arch -->
    <path d="M 540 480 L 540 320 Q 600 240 660 320 L 660 480 Z" />

    <!-- Architrave / Frieze -->
    <rect x="120" y="200" width="960" height="40" rx="3" />

    <!-- Central Classical Dome -->
    <path d="M 510 200 Q 600 70 690 200 Z" />
    <!-- Finial / Kalasha on Dome -->
    <line x1="600" y1="70" x2="600" y2="30" stroke="#C5A568" stroke-width="4" />
    <circle cx="600" cy="25" r="7" />
  </g>

  <!-- Foreground Elegant Institutional Glass Card -->
  <rect x="100" y="80" width="1000" height="515" rx="16" fill="#142B21" fill-opacity="0.82" stroke="#C5A568" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Subtle decorative gold border corner accents -->
  <path d="M 100 120 L 100 80 L 140 80" fill="none" stroke="#C5A568" stroke-width="3" />
  <path d="M 1100 120 L 1100 80 L 1060 80" fill="none" stroke="#C5A568" stroke-width="3" />
  <path d="M 100 555 L 100 595 L 140 595" fill="none" stroke="#C5A568" stroke-width="3" />
  <path d="M 1100 555 L 1100 595 L 1060 595" fill="none" stroke="#C5A568" stroke-width="3" />

  <!-- Institutional Crest / Header Stamp -->
  <circle cx="600" cy="180" r="44" fill="#193B2A" stroke="#C5A568" stroke-width="2" />
  <circle cx="600" cy="180" r="38" fill="none" stroke="#829B86" stroke-width="1" stroke-dasharray="3,3" />
  
  <!-- Emblem Center Flame / Star -->
  <path d="M 600 152 Q 612 168 607 182 Q 600 192 593 182 Q 588 168 600 152 Z" fill="#C5A568" />
  <circle cx="600" cy="198" r="4" fill="#C5A568" />

  <!-- Badge Tag -->
  <rect x="490" y="248" width="220" height="28" rx="14" fill="#193B2A" stroke="#829B86" stroke-width="1" stroke-opacity="0.4" />
  <text x="600" y="266" font-family="'Manrope', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#C5A568" text-anchor="middle" letter-spacing="2">ALL INDIA COUNCIL FOR TECHNICAL EDUCATION</text>

  <!-- Title -->
  <text x="600" y="340" font-family="'Manrope', -apple-system, sans-serif" font-size="36" font-weight="700" fill="#F7F5EF" text-anchor="middle" letter-spacing="0.5">Multi-Bureau Coordination Centre</text>

  <!-- Subtitle -->
  <text x="600" y="385" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="400" fill="#829B86" text-anchor="middle">Joint Inquiry Groups, Lead Bureau Assignment & Unified Fact-Finding</text>

  <!-- Elegant Divider -->
  <line x1="450" y1="425" x2="750" y2="425" stroke="#C5A568" stroke-width="1" stroke-opacity="0.5" />
  <circle cx="600" cy="425" r="3" fill="#C5A568" />

  <!-- Footer Tagline -->
  <text x="600" y="475" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="500" fill="#E9E3D6" text-anchor="middle" opacity="0.9">AICTE CaseConnect · Statutory Grievance Redressal Portal</text>
  <text x="600" y="505" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#C58B3B" text-anchor="middle" letter-spacing="1">SIH 2026 · REGULATORY COMPLIANCE SYSTEM</text>
</svg>